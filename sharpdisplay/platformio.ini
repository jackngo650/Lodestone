; Sharp Memory Display demo (Adafruit 1.3" 144x168 breakout)
; Pick the environment that matches the ESP32 board you wire it to.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SHARP Memory Display
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

; Heltec WiFi LoRa 32 V4 or any ESP32-S3 dev board
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; classic ESP32 dev board (ESP32-WROOM DevKit)
[env:esp32dev]
board = esp32dev
